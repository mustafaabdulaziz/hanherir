  <script>
    try {
      var saved = localStorage.getItem("kh_lang") || "ar";
      if (saved !== "ar" && saved !== "tr" && saved !== "en") saved = "ar";
      document.documentElement.lang = saved;
      document.documentElement.dir = saved === "ar" ? "rtl" : "ltr";
    } catch (e) {}
  </script>
